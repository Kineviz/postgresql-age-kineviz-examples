services:
  broker:
    # Apache Kafka 3.9.1, multi-architecture manifest.
    image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  sink:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./gxr stream prepare first}
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_healthy}
    restart: on-failure
  producer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    command: ["node", "--experimental-strip-types", "streaming/producer.ts"]
    environment:
      REPLAY_RATE: ${REPLAY_RATE:-100}
      REPLAY_LIMIT: ${REPLAY_LIMIT:-12033}
    volumes:
      - ./.generated/paysim-schemaless:/data:ro
    depends_on:
      broker: {condition: service_healthy}
volumes:
  kafka-data:
